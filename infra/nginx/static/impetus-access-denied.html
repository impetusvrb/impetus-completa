<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>IMPETUS — Acesso restrito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070c14;
      --panel: #0f1a28;
      --cyan: #00d4ff;
      --text: #c8d6e5;
      --muted: #6b7f94;
      --border: rgba(0, 212, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      padding: 24px;
    }
    .panel {
      max-width: 480px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px 28px;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.06);
    }
    .label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .code {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--cyan);
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="label">IMPETUS · Controlo de acesso</div>
    <h1>Acesso não autorizado</h1>
    <p>Este endereço IP não está na lista de acesso da plataforma IMPETUS.</p>
    <p>Para utilizar o software, a sua empresa precisa de ter o IP autorizado pela equipa IMPETUS antes do primeiro acesso.</p>
    <p class="code">HTTP 403 · IP não autorizado</p>
  </div>
</body>
</html>
