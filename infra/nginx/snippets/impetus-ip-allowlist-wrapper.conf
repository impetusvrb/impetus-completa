# IMPETUS — Allowlist IP visitante (após real_ip Cloudflare)
# Incluído no server 443 quando IMPETUS_IP_ALLOWLIST está activo.
# Webhooks de pagamento/Meta ficam abertos em locations dedicadas.

error_page 403 /index.html;

location = /index.html {
    allow all;
    root /var/www/impetus-denied;
    internal;
    default_type text/html;
}

# Aplica allowlist ao tráfego normal (usa IP real do visitante via CF-Connecting-IP)
include /etc/nginx/snippets/impetus-ip-allowlist.conf;
