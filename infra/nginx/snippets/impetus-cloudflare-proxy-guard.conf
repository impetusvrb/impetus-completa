# Exige proxy Cloudflare apenas para plataformaimpetus.com (não afecta srv1422313.hstgr.cloud).
set $impetus_cf_only 0;
if ($host ~* ^(plataformaimpetus\.com|www\.plataformaimpetus\.com)$) {
    set $impetus_cf_only 1;
}
if ($http_cf_ray = "") {
    set $impetus_cf_only "${impetus_cf_only}1";
}
if ($impetus_cf_only = 11) {
    return 403 "IMPETUS: use Cloudflare proxy";
}
