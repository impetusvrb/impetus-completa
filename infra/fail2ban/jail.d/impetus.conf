# IMPETUS — fail2ban jails
[DEFAULT]
bantime  = 24h
findtime = 10m
maxretry = 8
banaction = ufw
backend = systemd

[sshd]
enabled  = true
port     = ssh
filter   = sshd
maxretry = 5
bantime  = 48h

[impetus-nginx-scan]
enabled  = true
port     = http,https
filter   = impetus-nginx-scan
logpath  = /var/log/nginx/impetus-access.log
           /var/log/nginx/access.log
maxretry = 10
findtime = 5m
bantime  = 7d

[nginx-limit-req]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = /var/log/nginx/error.log
maxretry = 15
findtime = 5m
bantime  = 1h

[impetus-auth-fail]
enabled  = true
port     = http,https
filter   = impetus-auth-fail
logpath  = /var/log/nginx/impetus-access.log
maxretry = 8
findtime = 10m
bantime  = 24h
