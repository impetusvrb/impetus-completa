# IMPETUS — fail2ban filter: scanning paths sensíveis (403/404)
# Compatível com log_format impetus_detailed e access log padrão
[Definition]

failregex = ^<HOST> -.*"(?:GET|HEAD|POST|PUT|DELETE|PATCH) [^"]*(?:/\.env|/\.git|/\.aws|/\.gcp|docker-compose|wp-config|/server\.js|/actuator/|/\.flaskenv|/\.envrc|terraform\.tfstate|terraform\.tfvars)[^"]*" (?:403|404|444)

ignoreregex = ^127\.0\.0\.1 
              ^::1
