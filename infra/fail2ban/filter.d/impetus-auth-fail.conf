# IMPETUS — fail2ban: falhas repetidas de login (app + painel equipe)
[Definition]

failregex = ^<HOST> -.*"POST /api/auth/login HTTP[^"]*" 401
            ^<HOST> -.*"POST /api/impetus-admin/auth/login HTTP[^"]*" 401
            ^<HOST> -.*"POST /api/impetus-admin/auth/login HTTP[^"]*" 403

ignoreregex = ^127\.0\.0\.1
              ^::1
